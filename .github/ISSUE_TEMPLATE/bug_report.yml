name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a bot token, real chat/user ID, private file, absolute server path, full trace, or unsanitized log.
        Security vulnerabilities belong in GitHub Private Vulnerability Reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version/commit, Iva version, Eve version, Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps and sanitized output using invented filenames and content
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, identifiers, private content, local paths and unsanitized logs.
          required: true
